<text x="40" y="436" font-size="14" xml:space="preserve"><tspan fill="#ac3185">def </tspan><tspan fill="#2f5dcc">first_pitch</tspan><tspan fill="#1c2030">(</tspan><tspan fill="#c0250d">team</tspan><tspan fill="#1c2030">: </tspan><tspan fill="#865d02">str</tspan><tspan fill="#1c2030">, </tspan><tspan fill="#c0250d">inning</tspan><tspan fill="#1c2030">: </tspan><tspan fill="#865d02">int</tspan><tspan fill="#1c2030"> = </tspan><tspan fill="#ae4203">1</tspan><tspan fill="#1c2030">) -&gt; </tspan><tspan fill="#865d02">Game</tspan><tspan fill="#1c2030">:</tspan></text>
