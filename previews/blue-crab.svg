<text x="40" y="414" font-size="14" xml:space="preserve"><tspan fill="#35525b"># Opening day at the ballpark</tspan></text>
<text x="40" y="436" font-size="14" xml:space="preserve"><tspan fill="#d48bb0">def </tspan><tspan fill="#7fb0e6">first_pitch</tspan><tspan fill="#dfe8e6">(</tspan><tspan fill="#ed5a3b">team</tspan><tspan fill="#dfe8e6">: </tspan><tspan fill="#e6b450">str</tspan><tspan fill="#dfe8e6">, </tspan><tspan fill="#ed5a3b">inning</tspan><tspan fill="#dfe8e6">: </tspan><tspan fill="#e6b450">int</tspan><tspan fill="#dfe8e6"> = </tspan><tspan fill="#f2802a">1</tspan><tspan fill="#dfe8e6">) -&gt; </tspan><tspan fill="#e6b450">Game</tspan><tspan fill="#dfe8e6">:</tspan></text>
