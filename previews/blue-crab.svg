<text x="40" y="480" font-size="14" xml:space="preserve"><tspan fill="#d48bb0">        raise </tspan><tspan fill="#e6b450">ValueError</tspan><tspan fill="#dfe8e6">(</tspan><tspan fill="#6fbf8e">&quot;no lineup\n&quot;</tspan><tspan fill="#dfe8e6">)</tspan></text>
<text x="40" y="502" font-size="14" xml:space="preserve"><tspan fill="#d48bb0">    return </tspan><tspan fill="#e6b450">Game</tspan><tspan fill="#dfe8e6">(home=</tspan><tspan fill="#6fbf8e">&quot;Birds&quot;</tspan><tspan fill="#dfe8e6">, innings=</tspan><tspan fill="#f2802a">9</tspan><tspan fill="#dfe8e6"> + </tspan><tspan fill="#ed5a3b">inning</tspan><tspan fill="#dfe8e6">)</tspan></text>
