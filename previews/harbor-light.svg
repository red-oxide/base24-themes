<text x="40" y="436" font-size="14" xml:space="preserve"><tspan fill="#924c80">def </tspan><tspan fill="#346a85">first_pitch</tspan><tspan fill="#1e2427">(</tspan><tspan fill="#bb3106">team</tspan><tspan fill="#1e2427">: </tspan><tspan fill="#75611d">str</tspan><tspan fill="#1e2427">, </tspan><tspan fill="#bb3106">inning</tspan><tspan fill="#1e2427">: </tspan><tspan fill="#75611d">int</tspan><tspan fill="#1e2427"> = </tspan><tspan fill="#a74701">1</tspan><tspan fill="#1e2427">) -&gt; </tspan><tspan fill="#75611d">Game</tspan><tspan fill="#1e2427">:</tspan></text>
