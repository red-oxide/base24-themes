<text x="40" y="480" font-size="14" xml:space="preserve"><tspan fill="#924c80">        raise </tspan><tspan fill="#75611d">ValueError</tspan><tspan fill="#1e2427">(</tspan><tspan fill="#2f7057">&quot;no lineup\n&quot;</tspan><tspan fill="#1e2427">)</tspan></text>
<text x="40" y="502" font-size="14" xml:space="preserve"><tspan fill="#924c80">    return </tspan><tspan fill="#75611d">Game</tspan><tspan fill="#1e2427">(home=</tspan><tspan fill="#2f7057">&quot;Orioles&quot;</tspan><tspan fill="#1e2427">, innings=</tspan><tspan fill="#a74701">9</tspan><tspan fill="#1e2427"> + </tspan><tspan fill="#bb3106">inning</tspan><tspan fill="#1e2427">)</tspan></text>
