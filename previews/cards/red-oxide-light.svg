<text x="16" y="81" font-size="11" xml:space="preserve"><tspan fill="#a3454c">        raise </tspan><tspan fill="#805d18">ValueError</tspan><tspan fill="#2a1c18">(</tspan><tspan fill="#456d47">&quot;no lineup\n&quot;</tspan><tspan fill="#2a1c18">)</tspan></text>
<text x="16" y="98" font-size="11" xml:space="preserve"><tspan fill="#a3454c">    return </tspan><tspan fill="#805d18">Game</tspan><tspan fill="#2a1c18">(home=</tspan><tspan fill="#456d47">&quot;Birds&quot;</tspan><tspan fill="#2a1c18">, innings=</tspan><tspan fill="#a34a0e">9</tspan><tspan fill="#2a1c18"> + </tspan><tspan fill="#9a3b26">inning</tspan><tspan fill="#2a1c18">)</tspan></text>
