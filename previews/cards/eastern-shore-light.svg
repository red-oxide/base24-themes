<text x="16" y="30" font-size="11" xml:space="preserve"><tspan fill="#9d9d98"># Oriole Park at Camden Yards</tspan></text>
<text x="16" y="47" font-size="11" xml:space="preserve"><tspan fill="#a04b4b">def </tspan><tspan fill="#46688e">first_pitch</tspan><tspan fill="#222222">(</tspan><tspan fill="#b23d0e">team</tspan><tspan fill="#222222">: </tspan><tspan fill="#7e6122">str</tspan><tspan fill="#222222">, </tspan><tspan fill="#b23d0e">inning</tspan><tspan fill="#222222">: </tspan><tspan fill="#7e6122">int</tspan><tspan fill="#222222"> = </tspan><tspan fill="#a84802">1</tspan><tspan fill="#222222">) -&gt; </tspan><tspan fill="#7e6122">Game</tspan><tspan fill="#222222">:</tspan></text>
<text x="16" y="64" font-size="11" xml:space="preserve"><tspan fill="#a04b4b">    if not </tspan><tspan fill="#b23d0e">team</tspan><tspan fill="#222222">:</tspan></text>
<text x="16" y="81" font-size="11" xml:space="preserve"><tspan fill="#a04b4b">        raise </tspan><tspan fill="#7e6122">ValueError</tspan><tspan fill="#222222">(</tspan><tspan fill="#556b38">&quot;no lineup\n&quot;</tspan><tspan fill="#222222">)</tspan></text>
<text x="16" y="98" font-size="11" xml:space="preserve"><tspan fill="#a04b4b">    return </tspan><tspan fill="#7e6122">Game</tspan><tspan fill="#222222">(home=</tspan><tspan fill="#556b38">&quot;Orioles&quot;</tspan><tspan fill="#222222">, innings=</tspan><tspan fill="#a84802">9</tspan><tspan fill="#222222"> + </tspan><tspan fill="#b23d0e">inning</tspan><tspan fill="#222222">)</tspan></text>
