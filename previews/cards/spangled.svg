<text x="16" y="30" font-size="11" xml:space="preserve"><tspan fill="#434860"># Opening day at the ballpark</tspan></text>
<text x="16" y="47" font-size="11" xml:space="preserve"><tspan fill="#d98bc0">def </tspan><tspan fill="#8ea6e0">first_pitch</tspan><tspan fill="#e6e1d6">(</tspan><tspan fill="#e8513a">team</tspan><tspan fill="#e6e1d6">: </tspan><tspan fill="#f2b632">str</tspan><tspan fill="#e6e1d6">, </tspan><tspan fill="#e8513a">inning</tspan><tspan fill="#e6e1d6">: </tspan><tspan fill="#f2b632">int</tspan><tspan fill="#e6e1d6"> = </tspan><tspan fill="#f06a1d">1</tspan><tspan fill="#e6e1d6">) -&gt; </tspan><tspan fill="#f2b632">Game</tspan><tspan fill="#e6e1d6">:</tspan></text>
<text x="16" y="64" font-size="11" xml:space="preserve"><tspan fill="#d98bc0">    if not </tspan><tspan fill="#e8513a">team</tspan><tspan fill="#e6e1d6">:</tspan></text>
<text x="16" y="81" font-size="11" xml:space="preserve"><tspan fill="#d98bc0">        raise </tspan><tspan fill="#f2b632">ValueError</tspan><tspan fill="#e6e1d6">(</tspan><tspan fill="#7fae5e">&quot;no lineup\n&quot;</tspan><tspan fill="#e6e1d6">)</tspan></text>
<text x="16" y="98" font-size="11" xml:space="preserve"><tspan fill="#d98bc0">    return </tspan><tspan fill="#f2b632">Game</tspan><tspan fill="#e6e1d6">(home=</tspan><tspan fill="#7fae5e">&quot;Birds&quot;</tspan><tspan fill="#e6e1d6">, innings=</tspan><tspan fill="#f06a1d">9</tspan><tspan fill="#e6e1d6"> + </tspan><tspan fill="#e8513a">inning</tspan><tspan fill="#e6e1d6">)</tspan></text>
