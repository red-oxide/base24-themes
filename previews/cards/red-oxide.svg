<text x="16" y="30" font-size="11" xml:space="preserve"><tspan fill="#54453f"># Opening day at the ballpark</tspan></text>
<text x="16" y="47" font-size="11" xml:space="preserve"><tspan fill="#c98a8f">def </tspan><tspan fill="#8ea6c8">first_pitch</tspan><tspan fill="#e8e4dd">(</tspan><tspan fill="#dc5a3e">team</tspan><tspan fill="#e8e4dd">: </tspan><tspan fill="#d6a94e">str</tspan><tspan fill="#e8e4dd">, </tspan><tspan fill="#dc5a3e">inning</tspan><tspan fill="#e8e4dd">: </tspan><tspan fill="#d6a94e">int</tspan><tspan fill="#e8e4dd"> = </tspan><tspan fill="#e5823f">1</tspan><tspan fill="#e8e4dd">) -&gt; </tspan><tspan fill="#d6a94e">Game</tspan><tspan fill="#e8e4dd">:</tspan></text>
<text x="16" y="64" font-size="11" xml:space="preserve"><tspan fill="#c98a8f">    if not </tspan><tspan fill="#dc5a3e">team</tspan><tspan fill="#e8e4dd">:</tspan></text>
<text x="16" y="81" font-size="11" xml:space="preserve"><tspan fill="#c98a8f">        raise </tspan><tspan fill="#d6a94e">ValueError</tspan><tspan fill="#e8e4dd">(</tspan><tspan fill="#82ad84">&quot;no lineup\n&quot;</tspan><tspan fill="#e8e4dd">)</tspan></text>
<text x="16" y="98" font-size="11" xml:space="preserve"><tspan fill="#c98a8f">    return </tspan><tspan fill="#d6a94e">Game</tspan><tspan fill="#e8e4dd">(home=</tspan><tspan fill="#82ad84">&quot;Birds&quot;</tspan><tspan fill="#e8e4dd">, innings=</tspan><tspan fill="#e5823f">9</tspan><tspan fill="#e8e4dd"> + </tspan><tspan fill="#dc5a3e">inning</tspan><tspan fill="#e8e4dd">)</tspan></text>
