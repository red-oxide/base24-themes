<text x="40" y="502" font-size="14" xml:space="preserve"><tspan fill="#ae3974">    return </tspan><tspan fill="#865e0d">Game</tspan><tspan fill="#13282d">(home=</tspan><tspan fill="#2f7349">&quot;Orioles&quot;</tspan><tspan fill="#13282d">, innings=</tspan><tspan fill="#a74902">9</tspan><tspan fill="#13282d"> + </tspan><tspan fill="#c42909">inning</tspan><tspan fill="#13282d">)</tspan></text>
